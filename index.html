
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leonardo S. Amaral — oleoamaral</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="assets/images/favicon.svg"
    >

    <!-- Aplicar o tema salvo antes de exibir a página -->
    <script>
        try {
            const theme = localStorage.getItem("theme");

            document.documentElement.dataset.theme =
                theme === "dark" ? "dark" : "light";
        } catch (error) {
            document.documentElement.dataset.theme = "light";
        }
    </script>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ========================================
         CABEÇALHO
    ========================================= -->

    <header class="site-header">

        <a
            href="#inicio"
            class="site-logo"
            aria-label="Voltar ao início"
        >
            <img
                src="assets/images/lnrd-mrl.png"
                alt=""
            >
        </a>

        <div class="header-actions">

            <nav
                class="site-nav"
                aria-label="Navegação principal"
            >

                <a
                    href="#sobre"
                    data-pt="Sobre"
                    data-en="About"
                >Sobre</a>

                <a
                    href="#projetos"
                    data-pt="Projetos"
                    data-en="Projects"
                >Projetos</a>

                <a
                    href="#contato"
                    data-pt="Contato"
                    data-en="Contact"
                >Contato</a>

            </nav>

            <div class="site-controls">

                <button
                    id="theme-toggle"
                    type="button"
                    aria-label="Ativar tema escuro"
                    aria-pressed="false"
                    title="Ativar tema escuro"
                >☾</button>

                <button
                    id="language-toggle"
                    type="button"
                    aria-label="Switch to English"
                    title="Alterar idioma"
                >EN</button>

            </div>

        </div>

    </header>


    <main>

        <!-- ========================================
             SEPARADOR 1 — RESISTOR
             Abaixo do cabeçalho
        ========================================= -->

        <div class="circuit-divider" aria-hidden="true">

            <span class="circuit-wire"></span>

            <svg
                class="circuit-symbol"
                viewBox="0 0 80 32"
            >
                <path
                    d="M0 16 H10
                       L20 6 L30 26
                       L40 6 L50 26
                       L60 6 L70 16
                       H80"
                />
            </svg>

            <span class="circuit-wire"></span>

        </div>


        <!-- ========================================
             APRESENTAÇÃO
        ========================================= -->

        <section class="intro" id="inicio">

            <div class="intro-content">

                <h1>Leonardo S. Amaral</h1>

                <p
                    class="intro-course"
                    data-pt="Engenharia de Telecomunicações"
                    data-en="Telecommunications Engineering"
                >
                    Engenharia de Telecomunicações
                </p>

                <p
                    class="intro-university"
                    data-pt="Universidade Federal de Santa Maria"
                    data-en="Federal University of Santa Maria"
                >
                    Universidade Federal de Santa Maria
                </p>

            </div>

        </section>


        <!-- ========================================
             SEPARADOR 2 — INDUTOR
             Antes de Sobre
        ========================================= -->

        <div class="circuit-divider" aria-hidden="true">

            <span class="circuit-wire"></span>

            <svg
                class="circuit-symbol"
                viewBox="0 0 80 32"
            >
                <path
                    d="M0 16 H10
                       A10 10 0 0 1 30 16
                       A10 10 0 0 1 50 16
                       A10 10 0 0 1 70 16
                       H80"
                />
            </svg>

            <span class="circuit-wire"></span>

        </div>


        <!-- ========================================
             SOBRE
        ========================================= -->

        <section class="about" id="sobre">

            <h2
                class="section-label"
                data-pt="Sobre"
                data-en="About"
            >
                Sobre
            </h2>

        </section>


        <!-- ========================================
             SEPARADOR 3 — CAPACITOR
             Antes de Projetos
        ========================================= -->

        <div class="circuit-divider" aria-hidden="true">

            <span class="circuit-wire"></span>

            <svg
                class="circuit-symbol"
                viewBox="0 0 80 32"
            >
                <path d="M0 16 H34 M46 16 H80" />
                <path d="M34 3 V29 M46 3 V29" />
            </svg>

            <span class="circuit-wire"></span>

        </div>


        <!-- ========================================
             PROJETOS
        ========================================= -->

        <section class="projects" id="projetos">

            <h2 class="section-label">

                <span
                    data-pt="Projetos"
                    data-en="Projects"
                >
                    Projetos
                </span>

                <em
                    data-pt="— acadêmicos, pessoais e profissionais."
                    data-en="— academic, personal and professional."
                >
                    — acadêmicos, pessoais e profissionais.
                </em>

            </h2>

            <div class="projects-list">
                <!-- Projetos serão adicionados futuramente -->
            </div>

        </section>

    </main>


    <!-- ========================================
         SEPARADOR 4 — MODULAÇÃO AM
         Acima do rodapé
    ========================================= -->

    <div class="circuit-divider" aria-hidden="true">

        <span class="circuit-wire"></span>

        <svg
            class="circuit-symbol am-symbol"
            viewBox="0 0 120 40"
        >
            <path id="am-wave"></path>
        </svg>

        <span class="circuit-wire"></span>

    </div>


    <!-- ========================================
         RODAPÉ / CONTATO
    ========================================= -->

    <footer class="site-footer" id="contato">

        <span>Leonardo S. Amaral</span>

        <a
            href="https://github.com/oleoamaral"
            target="_blank"
            rel="noopener noreferrer"
        >
            GitHub ↗
        </a>

    </footer>


    <script src="script.js"></script>

</body>
</html>
