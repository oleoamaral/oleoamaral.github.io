
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leonardo S. Amaral — oleoamaral</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="assets/images/favicon.svg"
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Cabeçalho -->

    <header class="site-header">
        <a
            href="#inicio"
            class="site-logo"
            aria-label="Voltar ao início"
        >
            <img
                src="assets/images/lnrd-mrl.png"
                alt=""
            >
        </a>

        <div class="header-actions">

            <nav class="site-nav" aria-label="Navegação principal">
                <a
                    href="#sobre"
                    data-pt="Sobre"
                    data-en="About"
                >Sobre</a>

                <a
                    href="#projetos"
                    data-pt="Projetos"
                    data-en="Projects"
                >Projetos</a>

                <a
                    href="#contato"
                    data-pt="Contato"
                    data-en="Contact"
                >Contato</a>
            </nav>

            <div class="site-controls">
                <button
                    id="theme-toggle"
                    type="button"
                    aria-label="Ativar tema escuro"
                    title="Ativar tema escuro"
                >☾</button>

                <button
                    id="language-toggle"
                    type="button"
                    aria-label="Switch to English"
                    title="Alterar idioma"
                >EN</button>
            </div>

        </div>
    </header>

    <main>

        <!-- Apresentação -->

        <section class="intro" id="inicio">
            <div class="intro-content">
                <h1>Leonardo S. Amaral</h1>

                <p
                    class="intro-course"
                    data-pt="Engenharia de Telecomunicações"
                    data-en="Telecommunications Engineering"
                >
                    Engenharia de Telecomunicações
                </p>

                <p
                    class="intro-university"
                    data-pt="Universidade Federal de Santa Maria"
                    data-en="Federal University of Santa Maria"
                >
                    Universidade Federal de Santa Maria
                </p>
            </div>
        </section>

        <!-- Sobre -->

        <section class="about" id="sobre">
            <h2
                class="section-label"
                data-pt="Sobre"
                data-en="About"
            >Sobre</h2>
        </section>

        <!-- Projetos -->

        <section class="projects" id="projetos">
            <h2 class="section-label">
                <span
                    data-pt="Projetos"
                    data-en="Projects"
                >Projetos</span>

                <em
                    data-pt="— acadêmicos, pessoais e profissionais."
                    data-en="— academic, personal and professional."
                >— acadêmicos, pessoais e profissionais.</em>
            </h2>

            <div class="projects-list">
                <!-- Adicionar projetos futuramente -->
            </div>
        </section>

    </main>

    <!-- Rodapé / Contato -->

    <footer class="site-footer" id="contato">
        <span>Leonardo S. Amaral</span>

        <a
            href="https://github.com/oleoamaral"
            target="_blank"
            rel="noopener noreferrer"
        >GitHub ↗</a>
    </footer>

    <script src="script.js"></script>

</body>
</html>
